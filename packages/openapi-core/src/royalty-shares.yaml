openapi: 3.1.0
info:
  title: Royalty Shares API
  version: 0.1.0
  description: Per-execution royalty splits and statement-period ledgers.
  license:
    name: Proprietary
    url: https://cogbazaar.local/license
  x-domain: ryl
servers:
  - url: https://api.cogbazaar.local
security:
  - apiKey: []
tags:
  - name: RoyaltyShares
    description: Kernel and data royalties
paths:
  /v1/royalty-shares:
    get:
      operationId: listRoyaltyShares
      tags: [RoyaltyShares]
      summary: List royalty shares
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: jobId
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: ./royalty-shares.schemas.yaml#/components/schemas/RoyaltyRole
        - name: periodKey
          in: query
          schema:
            type: string
        - name: payeeParticipantId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: ./royalty-shares.schemas.yaml#/components/schemas/RoyaltyShareStatus
      responses:
        '200':
          description: Shares page / statement slice
          content:
            application/json:
              schema:
                $ref: ./royalty-shares.schemas.yaml#/components/schemas/RoyaltyShareListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createRoyaltyShare
      tags: [RoyaltyShares]
      summary: Create royalty share
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./royalty-shares.schemas.yaml#/components/schemas/RoyaltyShareCreateRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./royalty-shares.schemas.yaml#/components/schemas/RoyaltyShareResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/royalty-shares/{shareId}:
    parameters:
      - name: shareId
        in: path
        required: true
        schema:
          $ref: ./royalty-shares.schemas.yaml#/components/schemas/ShareId
    get:
      operationId: getRoyaltyShare
      tags: [RoyaltyShares]
      summary: Get royalty share
      responses:
        '200':
          description: Share
          content:
            application/json:
              schema:
                $ref: ./royalty-shares.schemas.yaml#/components/schemas/RoyaltyShareResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
