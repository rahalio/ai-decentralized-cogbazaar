components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ListingId:
      name: listingId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    AttestationId:
      name: attestationId
      in: path
      required: true
      schema:
        type: string
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
    PoolId:
      name: poolId
      in: path
      required: true
      schema:
        type: string
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Listing:
      type: object
      required:
      - id
      - listingType
      - sellerParticipantId
      - priceAmount
      - currency
      - status
      properties:
        id:
          type: string
        listingType:
          type: string
          enum:
          - dataset
          - kernel
          - compute
        sellerParticipantId:
          type: string
        priceAmount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - retired
        title:
          type: string
        licenceClass:
          type: string
          enum:
          - research
          - commercial
          - restricted
    ListingCreate:
      type: object
      required:
      - listingType
      - sellerParticipantId
      - priceAmount
      - currency
      - status
      properties:
        listingType:
          type: string
          enum:
          - dataset
          - kernel
          - compute
        sellerParticipantId:
          type: string
        priceAmount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - retired
        title:
          type: string
        licenceClass:
          type: string
          enum:
          - research
          - commercial
          - restricted
    DataEnvelopeListing:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Listing'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeListing:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Listing'
            nextCursor:
              type: string
        meta:
