apis:
  identity:
    root: src/identity.yaml
  listings:
    root: src/listings.yaml
  jobs:
    root: src/jobs.yaml
  pocw-attestations:
    root: src/pocw-attestations.yaml
  royalty-shares:
    root: src/royalty-shares.yaml
  grant-pools:
    root: src/grant-pools.yaml
  policy-rules:
    root: src/policy-rules.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
